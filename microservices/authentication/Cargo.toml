[package]
name = "authentication"
version = "0.1.0"
edition = "2024"


[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid"] }

argon2 = "0.5"
rand = "0.8"

jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }

tracing = "0.1"
tracing-subscriber = "0.3"

dotenvy = "0.15"

[dependencies.time]
version = "=0.3.36"

