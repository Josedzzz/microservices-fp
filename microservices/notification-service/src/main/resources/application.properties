# Server
server.port=8084
# Tell Spring to respect X-Forwarded-* headers from the API Gateway
server.forward-headers-strategy=framework

# Springdoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# This helps the UI find the config when proxied
springdoc.swagger-ui.config-url=/notifications-service/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/notifications-service/v3/api-docs

# Application
spring.application.name=notification-service

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:database-notifications}:${DB_PORT:5432}/${DB_NAME:notifications_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ Custom Properties
rabbitmq.exchange.name=employees.events
rabbitmq.queue.notifications=notifications.queue
rabbitmq.routing.key.created=employee.created
rabbitmq.routing.key.deleted=employee.deleted

# Logging
logging.level.com.microservices.notification=DEBUG

# Jackson configuration
spring.jackson.serialization.write-dates-as-timestamps=false
