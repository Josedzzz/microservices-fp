networks:
  onboarding-network:
    driver: bridge

volumes:
  postgres_employees_data:
  postgres_departments_data:
  rabbitmq_data:
  postgres_notifications_data:
  postgres_profiles_data:
  postgres_auth_data:

services:
  # ============================================
  # RABBITMQ (MESSAGE BROKER)
  # ============================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP (for services)
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - onboarding-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # DATABASE FOR EMPLOYEES SERVICE (Go)
  # ============================================
  database-employees:
    image: postgres:15-alpine
    container_name: database-employees
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employees_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_employees_data:/var/lib/postgresql/data
    networks:
      - onboarding-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employees_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # EMPLOYEES SERVICE (Go)
  # ============================================
  employees-service:
    build: ./microservices/employee-management/
    container_name: employees-service
    ports:
      - "8081:8081"
    environment:
      # Server configuration
      SERVER_PORT: 8081

      # Database configuration
      DB_HOST: database-employees
      DB_PORT: 5432
      DB_NAME: employees_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /

      # URL for departments service (Go through Gateway for security)
      DEPARTMENTS_SERVICE_URL: http://api-gateway:8080
      JWT_SECRET: supersecretkey
    depends_on:
      database-employees:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - onboarding-network
    restart: unless-stopped

  # ============================================
  # DATABASE FOR DEPARTMENTS SERVICE (Python)
  # ============================================
  database-departments:
    image: postgres:15-alpine
    container_name: database-departments
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: departments_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_departments_data:/var/lib/postgresql/data
    networks:
      - onboarding-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d departments_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # DEPARTMENTS SERVICE (Python/FastAPI)
  # ============================================
  departments-service:
    build: ./microservices/department-management/
    container_name: departments-service
    ports:
      - "8082:8082"
    environment:
      # Database configuration
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: database-departments
      DB_PORT: 5432
      DB_NAME: departments_db
      # Service configuration
      SERVICE_PORT: 8082
      JWT_SECRET: supersecretkey
    depends_on:
      database-departments:
        condition: service_healthy
    networks:
      - onboarding-network
    restart: unless-stopped

  # ============================================
  # DATABASE FOR NOTIFICATIONS SERVICE (Java)
  # ============================================
  database-notifications:
    image: postgres:15-alpine
    container_name: database-notifications
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_notifications_data:/var/lib/postgresql/data
    networks:
      - onboarding-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # NOTIFICATIONS SERVICE (Java/Spring Boot)
  # ============================================
  notifications-service:
    build: ./microservices/notification-service/
    container_name: notifications-service
    ports:
      - "8084:8084" # API rest port
    environment:
      # Database configuration
      DB_HOST: database-notifications
      DB_PORT: 5432
      DB_NAME: notifications_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      # RabbitMQ configuration
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest

      # Spring specific properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://database-notifications:5432/notifications_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate # Flyway takes care of migrations

      # Flyway automatically creates the tables too
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      JWT_SECRET: supersecretkey
    depends_on:
      database-notifications:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - onboarding-network
    restart: unless-stopped

  # ============================================
  # DATABASE FOR PROFILES SERVICE (TypeScript)
  # ============================================
  database-profiles:
    image: postgres:15-alpine
    container_name: database-profiles
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: profiles_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_profiles_data:/var/lib/postgresql/data
    networks:
      - onboarding-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profiles_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # PROFILES SERVICE (TypeScript/Express)
  # ============================================
  profiles-service:
    build: ./microservices/profile-management/
    container_name: profiles-service
    ports:
      - "8085:8085"
    environment:
      # Server configuration
      PORT: 8085

      # Database configuration
      DB_HOST: database-profiles
      DB_PORT: 5432
      DB_NAME: profiles_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      # RabbitMQ configuration
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: supersecretkey
    depends_on:
      database-profiles:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - onboarding-network
    restart: unless-stopped

  # ============================================
  # DATABASE FOR AUTH SERVICE (Go)
  # ============================================
  database-auth:
    image: postgres:15-alpine
    container_name: database-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - onboarding-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # AUTH SERVICE (Go)
  # ============================================
  auth-service:
    build: ./microservices/auth-service/
    container_name: auth-service
    ports:
      - "8083:8083"
    environment:
      # Server configuration
      SERVER_PORT: 8083

      # Database configuration
      DB_HOST: database-auth
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable

      # RabbitMQ configuration
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /

      # JWT configuration
      JWT_SECRET: supersecretkey
      JWT_EXPIRATION: 3600

    depends_on:
      database-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - onboarding-network
    restart: unless-stopped

  # ============================================
  # API GATEWAY (Centralized Security)
  # ============================================
  api-gateway:
    build: ./microservices/api-gateway/
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: 8080
      JWT_SECRET: supersecretkey
      AUTH_SERVICE_URL: http://auth-service:8083
      EMPLOYEES_SERVICE_URL: http://employees-service:8081
      DEPARTMENTS_SERVICE_URL: http://departments-service:8082
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8084
      PROFILES_SERVICE_URL: http://profiles-service:8085
    depends_on:
      auth-service:
        condition: service_started
      employees-service:
        condition: service_started
    networks:
      - onboarding-network
    restart: unless-stopped

  # ============================================
  # BDD TESTS (Cucumber)
  # ============================================
  bdd-tests:
    build: ./e2e-tests/
    container_name: bdd-tests
    environment:
      BASE_URL: http://api-gateway:8080
      JWT_SECRET: supersecretkey
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - onboarding-network
