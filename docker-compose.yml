networks:
  onboarding-network:
    driver: bridge

volumes:
  postgres_employees_data:
  postgres_departments_data:
  rabbitmq_data:
  postgres_notifications_data:

services:
  # ============================================
  # RABBITMQ (MESSAGE BROKER)
  # ============================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP (for services)
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - onboarding-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # DATABASE FOR EMPLOYEES SERVICE (Go)
  # ============================================
  database-employees:
    image: postgres:15-alpine
    container_name: database-employees
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employees_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_employees_data:/var/lib/postgresql/data
    networks:
      - onboarding-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employees_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # EMPLOYEES SERVICE (Go)
  # ============================================
  employees-service:
    build: ./microservices/employee-management/
    container_name: employees-service
    ports:
      - "8081:8081"
    environment:
      # Server configuration
      SERVER_PORT: 8081

      # Database configuration
      DB_HOST: database-employees
      DB_PORT: 5432
      DB_NAME: employees_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /

      # URL for departments service
      DEPARTMENTS_SERVICE_URL: http://departments-service:8082
    depends_on:
      database-employees:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - onboarding-network
    restart: unless-stopped

  # ============================================
  # DATABASE FOR DEPARTMENTS SERVICE (Python)
  # ============================================
  database-departments:
    image: postgres:15-alpine
    container_name: database-departments
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: departments_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_departments_data:/var/lib/postgresql/data
    networks:
      - onboarding-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d departments_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # DEPARTMENTS SERVICE (Python/FastAPI)
  # ============================================
  departments-service:
    build: ./microservices/department-management/
    container_name: departments-service
    ports:
      - "8082:8082"
    environment:
      # Database configuration
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: database-departments
      DB_PORT: 5432
      DB_NAME: departments_db
      # Service configuration
      SERVICE_PORT: 8082
    depends_on:
      database-departments:
        condition: service_healthy
    networks:
      - onboarding-network
    restart: unless-stopped

  # ============================================
  # DATABASE FOR NOTIFICATIONS SERVICE (Java)
  # ============================================
  database-notifications:
    image: postgres:15-alpine
    container_name: database-notifications
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_notifications_data:/var/lib/postgresql/data
    networks:
      - onboarding-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # NOTIFICATIONS SERVICE (Java/Spring Boot)
  # ============================================
  notifications-service:
    build: ./microservices/notification-service/
    container_name: notifications-service
    ports:
      - "8084:8084" # API rest port
    environment:
      # Database configuration
      DB_HOST: database-notifications
      DB_PORT: 5432
      DB_NAME: notifications_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      
      # RabbitMQ configuration
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      
      # Spring specific properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://database-notifications:5432/notifications_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate  # Flyway takes care of migrations
      
      # Flyway automatically creates the tables too
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    depends_on:
      database-notifications:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - onboarding-network
    restart: unless-stopped
