# Grafana Datasources Provisioning Configuration
# Automatically configures Prometheus and Loki datasources on Grafana startup

apiVersion: 1

datasources:
  # ============================================
  # PROMETHEUS DATASOURCE (METRICS)
  # ============================================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    basicAuth: false
    withCredentials: false
    jsonData:
      timeInterval: 15s

  # ============================================
  # LOKI DATASOURCE (LOGS)
  # ============================================
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    basicAuth: false
    withCredentials: false
    jsonData:
      maxLines: 1000
